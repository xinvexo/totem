[package]
name = "totem"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A tiny self-hosted TOTP authenticator"
license = "MIT"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
chacha20poly1305 = "0.10"
dotenvy = "0.15"
futures-core = "0.3"
hex = "0.4"
mime_guess = "2"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
totp-rs = { version = "6", features = ["otpauth"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
