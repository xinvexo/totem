# Nginx configuration for the custom /usr/local/nginx installation on the
# Totem host. The public 443 listener forwards TLS to 127.0.0.1:10431, so the
# HTTPS server below must use proxy_protocol on that local listener.

server {
    listen 80;
    listen [::]:80;
    server_name totem.xinvexo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/local/nginx/acme-challenge;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:10431 ssl proxy_protocol;
    http2 on;
    server_name totem.xinvexo.com;
    absolute_redirect off;
    port_in_redirect off;

    ssl_certificate /usr/local/nginx/conf/ssl/totem.xinvexo.com/fullchain.cer;
    ssl_certificate_key /usr/local/nginx/conf/ssl/totem.xinvexo.com/totem.xinvexo.com.key;

    location /api/totp/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
